version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/sitetracker.db}
      ENABLE_LIVE_MONITORING: ${ENABLE_LIVE_MONITORING:-false}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      USER_AGENT: ${USER_AGENT:-ChangeLensBot/0.1 (+https://github.com/yourname/site-tracker-analytics; portfolio project)}
      APP_ENV: docker
      LOG_LEVEL: INFO
    volumes:
      - sitetracker_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Optional Postgres profile: `docker compose --profile postgres up`
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: sitetracker
      POSTGRES_PASSWORD: sitetracker
      POSTGRES_DB: sitetracker
    ports:
      - "5432:5432"
    volumes:
      - sitetracker_pg_data:/var/lib/postgresql/data

volumes:
  sitetracker_data:
  sitetracker_pg_data:
